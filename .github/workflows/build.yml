name: Build OpenCode

on:
  push:
    branches: [ feature/tool-input-delta ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            artifact_name: opencode-ubuntu-latest
            build_args: --single --baseline
          - runner: macos-latest
            artifact_name: opencode-macos-latest
            build_args: --single --baseline
          - runner: macos-15-intel
            artifact_name: opencode-macos-intel
            build_args: --single
          - runner: windows-latest
            artifact_name: opencode-windows-latest
            build_args: --single --baseline

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Build
        run: bun run build ${{ matrix.build_args }}
        working-directory: packages/opencode
        env:
          OPENCODE_CHANNEL: latest
          OPENCODE_VERSION: 1.2.24

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: packages/opencode/dist/*/bin/*
          retention-days: 7
